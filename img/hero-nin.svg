<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Ilustracija grada Nina">
  <defs>
    <linearGradient id="nebo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bfe4ef"/>
      <stop offset="55%" stop-color="#7ec1d6"/>
      <stop offset="100%" stop-color="#1d6f8b"/>
    </linearGradient>
    <linearGradient id="more" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a86a4"/>
      <stop offset="100%" stop-color="#14536a"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#nebo)"/>
  <circle cx="1280" cy="200" r="90" fill="#f6efe2" opacity="0.85"/>
  <!-- otok / kopno -->
  <path d="M0 600 Q 400 540 800 600 T 1600 600 L1600 900 L0 900 Z" fill="url(#more)"/>
  <path d="M0 600 Q 400 555 800 600 T 1600 600" fill="none" stroke="#bfe4ef" stroke-width="4" opacity="0.5"/>
  <!-- crkvica silueta -->
  <g fill="#f6efe2" opacity="0.95">
    <rect x="740" y="430" width="120" height="120" rx="6"/>
    <path d="M740 430 L800 370 L860 430 Z"/>
    <rect x="788" y="470" width="24" height="80"/>
  </g>
  <!-- valovi -->
  <g stroke="#bfe4ef" stroke-width="3" fill="none" opacity="0.4">
    <path d="M120 720 q 30 -18 60 0 t 60 0 t 60 0"/>
    <path d="M1180 760 q 30 -18 60 0 t 60 0 t 60 0"/>
    <path d="M520 800 q 30 -18 60 0 t 60 0 t 60 0"/>
  </g>
  <text x="800" y="760" font-family="Poppins, Arial, sans-serif" font-size="64" font-weight="700" fill="#f6efe2" text-anchor="middle" letter-spacing="6">NIN</text>
  <text x="800" y="810" font-family="Poppins, Arial, sans-serif" font-size="26" fill="#f6efe2" text-anchor="middle" opacity="0.9">povijesni kraljevski grad</text>
</svg>
