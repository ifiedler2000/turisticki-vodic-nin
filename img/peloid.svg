<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Ilustracija ljekovitog peloida u ninskoj laguni">
  <defs>
    <linearGradient id="poz4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dfeef2"/>
      <stop offset="100%" stop-color="#ece0c8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#poz4)"/>
  <!-- laguna -->
  <ellipse cx="400" cy="340" rx="280" ry="150" fill="#7e6a4f" opacity="0.8"/>
  <ellipse cx="400" cy="320" rx="230" ry="120" fill="#5e4f3a"/>
  <!-- mjehurići -->
  <g fill="#dfeef2" opacity="0.7">
    <circle cx="320" cy="300" r="14"/>
    <circle cx="430" cy="340" r="20"/>
    <circle cx="500" cy="290" r="10"/>
    <circle cx="370" cy="360" r="12"/>
  </g>
  <text x="400" y="540" font-family="Poppins, Arial, sans-serif" font-size="34" font-weight="600" fill="#14536a" text-anchor="middle">Ljekoviti peloid</text>
</svg>
