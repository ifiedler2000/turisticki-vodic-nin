<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Ilustracija ninske solane">
  <defs>
    <linearGradient id="poz2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6efe2"/>
      <stop offset="100%" stop-color="#dfeef2"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#poz2)"/>
  <!-- bazeni za sol -->
  <g stroke="#1d6f8b" stroke-width="6" fill="#bfe4ef" opacity="0.85">
    <rect x="120" y="220" width="240" height="130" rx="6"/>
    <rect x="440" y="220" width="240" height="130" rx="6"/>
    <rect x="120" y="380" width="240" height="90" rx="6"/>
    <rect x="440" y="380" width="240" height="90" rx="6"/>
  </g>
  <!-- hrpa soli -->
  <path d="M340 250 L400 170 L460 250 Z" fill="#ffffff" stroke="#c66a45" stroke-width="4"/>
  <text x="400" y="540" font-family="Poppins, Arial, sans-serif" font-size="34" font-weight="600" fill="#14536a" text-anchor="middle">Ninske solane</text>
</svg>
